<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Test Site</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #1a7f37;
      --border: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #151b23;
        --text: #f0f6fc;
        --muted: #9198a1;
        --accent: #3fb950;
        --border: #3d444d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 34rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }
    .dot {
      width: .6rem;
      height: .6rem;
      border-radius: 50%;
      background: var(--accent);
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: .6rem 1.1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    #message { margin-top: 1rem; min-height: 1.6em; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span> Site is live</div>
    <h1>Hello, GitHub!</h1>
    <p>If you can read this page at your GitHub Pages address, your repository and deployment are working.</p>
    <button id="test-btn" type="button">Run a test</button>
    <div id="message" aria-live="polite"></div>
  </main>

  <script>
    document.getElementById("test-btn").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "JavaScript works. Loaded at " + new Date().toLocaleTimeString() + ".";
    });
  </script>
</body>
</html>
